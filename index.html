<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AIみるくちゃん｜温泉旅館みたけ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", sans-serif;
    background: #fffaf0; color: #4a3728;
    /* position:fixed + inset:0 なら、LINE内ブラウザでも確実に画面ぴったりになる */
    position: fixed; inset: 0;
    display: flex; flex-direction: column; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ===== ヘッダー：狭い画面では「猫＋文字」を横並びにして高さを節約 ===== */
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px 5px;
  }
  .milk-stage {
    position: relative; flex: 0 0 auto;
    width: 58px; height: 72px;
    animation: breathe 4s ease-in-out infinite; transform-origin: center bottom;
  }
  .milk-stage img { position: absolute; inset: 0; width: 100%; height: 100%; }
  @keyframes breathe { 0%,100%{transform:scale(1,1);} 50%{transform:scale(1.012,0.988);} }
  .tail { z-index: 1; transform-origin: 88.2% 90.5%; animation: sway 3.2s ease-in-out infinite; }
  @keyframes sway { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-9deg);} }
  .body-open { z-index: 2; }
  .body-closed { z-index: 3; opacity: 0; animation: blink 5s infinite; }
  @keyframes blink { 0%,91.9%,96.1%,100%{opacity:0;} 92%,96%{opacity:1;} }

  .head-text { min-width: 0; flex: 1 1 auto; }
  h1 {
    font-size: clamp(.82rem, 4.4vw, 1.18rem);
    line-height: 1.25; letter-spacing: .01em; font-weight: 700;
  }
  .sub {
    font-size: clamp(.58rem, 2.7vw, .72rem);
    color: #8a7358; margin-top: 2px; line-height: 1.35;
  }
  .sub .lang { white-space: nowrap; }

  /* ===== チャット：残りの高さを全部使う ===== */
  .chat-wrap { flex: 1 1 auto; min-height: 0; display: flex; padding: 0 6px 4px; }
  .chat-wrap iframe {
    flex: 1 1 auto; width: 100%; height: 100%; min-height: 0;
    border: 2px solid #c9a86a; border-radius: 12px; background: #fff; display: block;
  }

  footer {
    flex: 0 0 auto; text-align: center;
    font-size: clamp(.55rem, 2.4vw, .68rem); color: #a89a80;
    padding: 3px 0 4px; line-height: 1.3;
  }

  /* 画面が低いとき：さらに詰める */
  @media (max-height: 680px) {
    .milk-stage { width: 46px; height: 57px; }
    header { padding: 4px 8px 3px; gap: 8px; }
    .sub { font-size: .58rem; }
  }
  /* 極端に低いとき：説明文を隠してチャットを最優先 */
  @media (max-height: 560px) {
    .sub { display: none; }
    .milk-stage { width: 38px; height: 47px; }
    footer { display: none; }
  }

  /* ===== 広い画面：元の縦並びレイアウトに戻す ===== */
  @media (min-width: 720px) {
    header {
      flex-direction: column; text-align: center; gap: 0;
      padding: 10px 12px 6px;
    }
    .milk-stage { width: 120px; height: 149px; }
    h1 { font-size: 1.3rem; margin-top: 6px; letter-spacing: .04em; }
    .sub { font-size: .8rem; margin-top: 4px; }
    .chat-wrap { padding: 10px 16px 8px; max-width: 900px; width: 100%; margin: 0 auto; }
    footer { font-size: .72rem; padding: 4px 0 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="milk-stage">
    <img class="tail"        src="milk_tail_web_v4.png"        alt="">
    <img class="body-open"   src="milk_body_web_v4.png"        alt="AIみるくちゃん">
    <img class="body-closed" src="milk_body_closed_web_v4.png" alt="">
  </div>
  <div class="head-text">
    <h1>AIみるくちゃんに何でも聞いてにゃ</h1>
    <p class="sub">温泉旅館みたけ 公式AI案内係｜24時間対応<br class="nl"><span class="lang">English・中文・한국어 OK</span></p>
  </div>
</header>

<div class="chat-wrap">
  <iframe src="https://udify.app/chatbot/bvFGYCLLQLqURrWp" allow="microphone" title="AIみるくちゃんチャット"></iframe>
</div>

<footer>温泉旅館みたけ ☎ 0460-84-8344｜箱根・仙石原</footer>

</body>
</html>
