<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIみるくちゃん｜温泉旅館みたけ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", sans-serif;
    background: #fffaf0; color: #4a3728;
    height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  }

  header { flex: 0 0 auto; text-align: center; padding: 10px 12px 4px; }
  .milk-stage {
    position: relative; width: 96px; height: 119px; margin: 0 auto;
    animation: breathe 4s ease-in-out infinite; transform-origin: center bottom;
  }
  .milk-stage img { position: absolute; inset: 0; width: 100%; height: 100%; }
  @keyframes breathe { 0%,100%{transform:scale(1,1);} 50%{transform:scale(1.012,0.988);} }
  .tail { z-index: 1; transform-origin: 88.2% 90.5%; animation: sway 3.2s ease-in-out infinite; }
  @keyframes sway { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-9deg);} }
  .body-open { z-index: 2; }
  .body-closed { z-index: 3; opacity: 0; animation: blink 5s infinite; }
  @keyframes blink { 0%,91.9%,96.1%,100%{opacity:0;} 92%,96%{opacity:1;} }

  h1 { font-size: 1.05rem; margin-top: 5px; letter-spacing: .04em; }
  .sub { font-size: .68rem; color: #8a7358; margin-top: 3px; }

  .chat-wrap { flex: 1 1 auto; min-height: 0; display: flex; padding: 8px 8px 6px; }
  .chat-wrap iframe {
    flex: 1 1 auto; width: 100%; height: 100%; min-height: 0;
    border: 2px solid #c9a86a; border-radius: 14px; background: #fff;
  }

  footer { flex: 0 0 auto; text-align: center; font-size: .62rem; color: #a89a80; padding: 4px 0 6px; }

  @media (min-width: 720px) {
    .milk-stage { width: 120px; height: 149px; }
    h1 { font-size: 1.25rem; }
    .sub { font-size: .8rem; }
    .chat-wrap { padding: 10px 16px 8px; max-width: 900px; width: 100%; margin: 0 auto; }
    footer { font-size: .72rem; }
  }
</style>
</head>
<body>

<header>
  <div class="milk-stage">
    <img class="tail"        src="milk_tail_web_v4.png"        alt="">
    <img class="body-open"   src="milk_body_web_v4.png"        alt="AIみるくちゃん">
    <img class="body-closed" src="milk_body_closed_web_v4.png" alt="">
  </div>
  <h1>AIみるくちゃんに何でも聞いてにゃ</h1>
  <p class="sub">温泉旅館みたけ 公式AI案内係｜24時間対応｜English・中文・한국어 OK</p>
</header>

<div class="chat-wrap">
  <iframe src="https://udify.app/chatbot/bvFGYCLLQLqURrWp" allow="microphone" title="AIみるくちゃんチャット"></iframe>
</div>

<footer>温泉旅館みたけ ☎ 0460-84-8344｜箱根・仙石原</footer>

</body>
</html>
